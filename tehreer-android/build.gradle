plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'jacoco'
    id 'maven-publish'
    id 'signing'
}

ext {
    kotlinVersion = "2.4.10"
    composeVersion = "1.11.4"

    publishedGroupId = 'com.github.mta452'
    publishedArtifactId = 'tehreer-android'

    libraryName = 'Tehreer-Android'
    libraryVersion = '3.0'
    libraryDescription = 'A library that gives full control over text related technologies such as bidirectional algorithm, open type shaping, text typesetting and text rendering.'

    siteUrl = 'https://github.com/Tehreer/Tehreer-Android'

    developerId = 'mta452'
    developerName = 'Muhammad Tayyab Akram'
    developerEmail = 'dear_tayyab@yahoo.com'

    licenseName = 'The Apache Software License, Version 2.0'
    licenseUrl = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
    allLicenses = [ 'Apache-2.0' ]

    scmConnection = 'scm:git:github.com/Tehreer/Tehreer-Android.git'
    scmDeveloperConnection = 'scm:git:ssh://github.com/Tehreer/Tehreer-Android.git'
    scmUrl = 'https://github.com/Tehreer/Tehreer-Android/tree/master'

    mavenName = 'sonatype'
    mavenUrl = 'https://oss.sonatype.org/service/local/staging/deploy/maven2/'
}

Properties properties = new Properties()
properties.load(project.rootProject.file('local.properties').newDataInputStream())

ext['signing.keyId'] = properties.getProperty('signing.keyId')
ext['signing.password'] = properties.getProperty('signing.password')
ext['signing.secretKeyRingFile'] = properties.getProperty('signing.secretKeyRingFile')
ext['ossrhUsername'] = properties.getProperty('ossrhUsername')
ext['ossrhPassword'] = properties.getProperty('ossrhPassword')
ext['sonatypeStagingProfileId'] = properties.getProperty('sonatypeStagingProfileId')

group = publishedGroupId
version = libraryVersion

android {
    namespace = 'com.mta.tehreer'
    ndkVersion = '28.2.13676358'

    compileSdk = 37

    buildFeatures {
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = composeVersion
    }

    defaultConfig {
        minSdk = 23
        targetSdk = 37
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    sourceSets {
        androidTest {
            externalNativeBuild {
                cmake {
                    path 'src/androidTest/jni/CMakeLists.txt'
                    version '3.22.1'
                }
            }
        }
        main {
            externalNativeBuild {
                cmake {
                    path 'src/main/jni/CMakeLists.txt'
                    version '3.22.1'
                }
            }
        }
    }

    buildTypes {
        debug {
            testCoverageEnabled = true
        }
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')

            externalNativeBuild {
                cmake {
                    cFlags '-fvisibility=hidden'
                    cppFlags '-fvisibility=hidden'
                }
            }
        }
    }

    publishing {
        singleVariant("release") { }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation "androidx.compose.ui:ui:$composeVersion"
    implementation "androidx.compose.ui:ui-graphics:$composeVersion"
    implementation "androidx.compose.runtime:runtime:$composeVersion"
    implementation "androidx.compose.foundation:foundation:$composeVersion"
    implementation "androidx.compose.foundation:foundation-layout:$composeVersion"

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'org.mockito:mockito-core:5.23.0'
    androidTestImplementation 'com.linkedin.dexmaker:dexmaker-mockito-inline:2.28.6'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

artifacts {
    task apiDocs(type: Javadoc) {
        title = "$libraryName $libraryVersion API"
        source = android.sourceSets.main.java.srcDirs
        exclude '**/*.kt'

        options.links("https://developer.android.com/reference/")
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addStringOption("bottom", "Copyright &copy; 2023 $developerName. All rights reserved.")
    }

    apiDocs.classpath += project.files(androidComponents.sdkComponents.bootClasspath)

    androidComponents.onVariants(androidComponents.selector().all()) { variant ->
        apiDocs.classpath += variant.compileConfiguration
    }

    task javadocJar(type: Jar, dependsOn: apiDocs) {
        archiveClassifier.set('javadoc')
        from apiDocs.destinationDir
    }

    task sourcesJar(type: Jar) {
        archiveClassifier.set('sources')
        from android.sourceSets.main.java.srcDirs
    }

    archives javadocJar
    archives sourcesJar
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = publishedGroupId
                artifactId = publishedArtifactId
                version = libraryVersion

                from components.release

                artifact sourcesJar
                artifact javadocJar

                pom {
                    name = libraryName
                    description = libraryDescription
                    url = siteUrl

                    licenses {
                        license {
                            name = licenseName
                            url = licenseUrl
                        }
                    }

                    developers {
                        developer {
                            id = developerId
                            name = developerName
                            email = developerEmail
                        }
                    }

                    scm {
                        connection = scmConnection
                        developerConnection = scmDeveloperConnection
                        url = scmUrl
                    }
                }
            }
        }

        repositories {
            maven {
                name = mavenName
                url = mavenUrl

                credentials {
                    username = ossrhUsername
                    password = ossrhPassword
                }
            }
        }
    }
}

signing {
    sign publishing.publications
}
